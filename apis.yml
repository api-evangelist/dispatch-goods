name: Dispatch Goods
description: >-
  Dispatch Goods is a reusable-packaging and reverse-logistics company that
  offers returnable containers and insulated bags as an alternative to
  single-use and compostable packaging for direct-to-consumer meal kits,
  grocery delivery, and food-service operations. The company handles the full
  circular loop — packaging, collection, washing, and redistribution — and
  markets its reusable system as a cheaper and lower-impact substitute for
  cardboard, gel packs, and insulation, citing reductions in water use and CO2
  equivalent emissions. It was surfaced as a Techstars portfolio company and
  added to the API Evangelist network as a company profile; it does not
  currently publish a public API, developer portal, or technical documentation.
